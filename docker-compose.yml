# ============================================================
# MyM Waffles — Docker Compose
# ============================================================
# Servicios:
#   - dagster: webserver + código Python (ingesta, dbt runner)
#   - metabase: BI dashboard leyendo de DuckDB
#
# Volúmenes:
#   - ./: bind mount del código (edición en vivo desde el host)
#   - data: archivo .duckdb persistente entre reinicios
#   - dagster_home: metadata de Dagster (runs, logs)
#   - metabase_data: config de Metabase (dashboards, users, etc.)
#   - secrets: credenciales del service account (solo lectura)
#
# Puertos:
#   - 3000: Dagster UI
#   - 3001: Metabase
# ============================================================

services:
  # ------------------------------------------------------------
  # Dagster + dbt + ingesta
  # ------------------------------------------------------------
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mym_dagster
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Cargamos todo el .env (Google Sheets IDs, paths, etc.)
      GOOGLE_APPLICATION_CREDENTIALS: /workspace/secrets/credentials.json
      GSHEETS_PEDIDOS_ID: ${GSHEETS_PEDIDOS_ID}
      GSHEETS_PEDIDOS_TAB_PATTERN: ${GSHEETS_PEDIDOS_TAB_PATTERN}
      GSHEETS_PRECIOS_ID: ${GSHEETS_PRECIOS_ID}
      GSHEETS_PRECIOS_TAB: ${GSHEETS_PRECIOS_TAB}
      DUCKDB_PATH: /workspace/data/mym_waffles.duckdb
      DAGSTER_HOME: /opt/dagster/dagster_home
      DBT_PROFILE: ${DBT_PROFILE:-mym_waffles}
      DBT_TARGET: ${DBT_TARGET:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    volumes:
      # Código montado en vivo (edición desde el host se refleja en el container)
      - ./:/workspace
      # DuckDB persistente
      - ./data:/workspace/data
      # Dagster metadata persistente
      - dagster_home:/opt/dagster/dagster_home
      # Credenciales read-only
      - ./secrets:/workspace/secrets:ro
    # Comando explícito (mismo que en el Dockerfile pero visible acá para dev)
    command: dagster dev --host 0.0.0.0 --port 3000 --workspace /workspace/dagster_project/workspace.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------
  # Metabase (BI dashboard)
  # ------------------------------------------------------------
  # Nota: el driver DuckDB de Metabase es community-maintained.
  # Se instala en la primera corrida via MB_PLUGINS_DIR.
  # Si da problemas de estabilidad, plan B es exportar marts a Postgres.
  # ------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: mym_metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3001}:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
    volumes:
      # Config persistente de Metabase (dashboards, usuarios)
      - metabase_data:/metabase-data
      # DuckDB compartido con Dagster (read-only para Metabase)
      - ./data:/data:ro
      # Directorio de plugins (para el driver DuckDB)
      - metabase_plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - dagster

# ============================================================
# Volúmenes nombrados (persistentes entre reinicios)
# ============================================================
volumes:
  dagster_home:
    name: mym_dagster_home
  metabase_data:
    name: mym_metabase_data
  metabase_plugins:
    name: mym_metabase_plugins
