# ============================================================
# Configuración principal del proyecto dbt para MyM Waffles.
# ============================================================

name: 'mym_waffles'
version: '1.0.0'
config-version: 2

# El profile a usar (definido en profiles.yml).
profile: 'mym_waffles'

# Rutas relativas a este archivo.
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Donde dbt guarda artefactos de build (compiled SQL, logs, docs).
# Está en .gitignore.
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================
# Materializaciones por defecto según capa.
# ============================================================
# Staging: views (cambian frecuentemente, no vale la pena guardar).
# Intermediate: views (lógica intermedia).
# Marts: tables (capa final, se consulta desde el dashboard).
# ============================================================

models:
  mym_waffles:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
seeds:
  mym_waffles:
    +schema: seeds
    productos_catalogo:
      +column_types:
        masa: varchar
        sabor: varchar
        activo: boolean
    client_name_mapping:
      +column_types:
        nombre_normalizado: varchar
        cliente_canonico: varchar
        tipo_cliente: varchar
        es_ambiguo: boolean
    precios_historicos:
      +column_types:
        segmento: varchar
        producto_desc: varchar
        unidades_pack: integer
        precio_venta_ars: decimal(12,2)
        costo_pack_ars: decimal(12,2)
        valid_from: date
        valid_to: date
vars:
  umbral_coincide_ars: 1
  umbral_discrepancia_grande_ars: 1000
  umbral_alerta_desvios_b2b: 1.0  # nueva